# Production Database Configuration (Railway MySQL)
spring.datasource.url=jdbc:mysql://root:TscphnAMmUCynfRrvWjlETlQjOboNeSu@mysql.railway.internal:3306/railway
spring.datasource.username=${RAILWAY_MYSQL_USERNAME}
spring.datasource.password=${RAILWAY_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration for Production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Logging Configuration for Production
logging.level.com.foodrush=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Performance Settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
