services:
  # Spring Boot Application Service
  - type: web
    name: foodrush-api
    env: java
    plan: free
    buildCommand: "./mvnw clean package -DskipTests"
    startCommand: "java -jar target/food-ordering-system-0.0.1-SNAPSHOT.jar"
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RAILWAY_MYSQL_URL
        sync: false
      - key: RAILWAY_MYSQL_USERNAME
        sync: false
      - key: RAILWAY_MYSQL_PASSWORD
        sync: false
    healthCheckPath: /actuator/health
    autoDeploy: true

  # Optional: Add Redis if needed
  # - type: redis
  #   name: foodrush-redis
  #   plan: free
